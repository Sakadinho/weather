<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Favourites</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <p *ngIf="favourites.length === 0" class="ion-padding">
    You haven't saved any cities yet. Go to the Home tab and save one.
  </p>

  <ion-list>
    <ion-item-sliding *ngFor="let city of favourites">
      <ion-item button="true" (click)="viewWeather(city)">
        <ion-label>{{ city }}</ion-label>
      </ion-item>
      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="remove(city)">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <div *ngIf="selectedWeather" class="ion-padding weather-card">
    <h1>{{ selectedWeather.city.name }}, {{ selectedWeather.city.country }}</h1>
    <p class="temperature">{{ selectedWeather.weather.temperature }}&deg;C</p>
    <p>{{ weatherDescription() }}</p>
  </div>
</ion-content>
